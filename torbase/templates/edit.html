{% extends 'base.html' %}{% block content %}<a href="{{ url_for('index') }}">Back to notes</a><h1>{{ 'Edit note' if post else 'New note' }}</h1><section class="panel">{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" value="{{ request.form.get('title', post.title if post else '') }}" maxlength="160" required></label><label>Category<select name="category_id">{% for category in categories %}<option value="{{ category.id }}" {% if (request.form.get('category_id') or (post.category_id|string if post else '')) == category.id|string %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Note<textarea name="body" rows="9" maxlength="10000" required>{{ request.form.get('body', post.body if post else '') }}</textarea></label><button>Save note</button></form></section>{% endblock %}
