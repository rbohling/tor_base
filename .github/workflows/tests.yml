name: Database application tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: torbase_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --junitxml=results/junit.xml
        env:
          TEST_DATABASE_URL: mysql+pymysql://root:ci-only-password@127.0.0.1:3306/torbase_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/junit.xml
