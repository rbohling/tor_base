services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: torbase
      MYSQL_USER: torbase
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run configure.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run configure.py}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  init:
    build: .
    env_file: .env
    command: [flask, --app, torbase, init-db]
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
  app:
    build: .
    env_file: .env
    ports: ['127.0.0.1:8080:8000']
    networks: [database, web]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
  tor:
    build: deploy/tor
    profiles: [onion]
    volumes: [tor_data:/var/lib/tor]
    networks: [web, outbound]
    depends_on:
      app: {condition: service_healthy}
volumes:
  mysql_data:
  tor_data:
networks:
  database: {internal: true}
  web: {internal: true}
  outbound: {}
